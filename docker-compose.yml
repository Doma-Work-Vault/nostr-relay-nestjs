version: '3.8'

services:
  nostr-relay:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=${PORT:-8001}
    ports:
      - "${PORT:-8001}:${PORT:-8001}"  # Expose to host's localhost
    labels:
      - coolify.managed=true
      - traefik.enable=true
